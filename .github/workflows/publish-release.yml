name: Publish verified GitHub prerelease
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Completed packaging run
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: finalized-public-release
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/public
      - run: node tools/package-release.mjs --out artifacts/public --publish
        env:
          GH_TOKEN: ${{ github.token }}
