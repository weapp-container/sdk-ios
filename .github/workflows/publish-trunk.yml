name: Publish verified iOS Pod to CocoaPods Trunk
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful GitHub release publication run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the successful release publisher at this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const id = process.env.RELEASE_RUN_ID;
          if (!/^\d+$/.test(id ?? '')) throw Error('A numeric publish-release run ID is required');
          const run = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`]));
          if (run.status !== 'completed' || run.conclusion !== 'success'
            || run.path !== '.github/workflows/publish-release.yml' || run.head_sha !== process.env.GITHUB_SHA) {
            throw Error('A successful publish-release run at this exact source commit is required');
          }
          const pkg = JSON.parse(execFileSync(process.execPath, ['-e', "process.stdout.write(require('fs').readFileSync('package.json'))"]));
          const version = pkg.version;
          const pinned = JSON.parse(execFileSync(process.execPath, ['-e', "process.stdout.write(require('fs').readFileSync('release-assets.json'))"]));
          if (pinned.sdkVersion !== version || pinned.tag !== `v${version}`) throw Error('Committed release pins do not match the SDK version');
          const release = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/releases/tags/v${version}`]));
          if (release.draft || !release.prerelease || release.tag_name !== `v${version}`) throw Error('The exact public prerelease is unavailable');
          for (const expected of pinned.assets) {
            const matches = release.assets.filter(asset => asset.name === expected.fileName);
            if (matches.length !== 1 || matches[0].size !== expected.size || matches[0].digest !== `sha256:${expected.sha256}`) {
              throw Error(`Published asset differs from the reviewed pin: ${expected.fileName}`);
            }
          }
          const native = pinned.assets.find(asset => asset.component === 'swiftpm-native');
          const podArchive = pinned.assets.find(asset => asset.component === 'cocoapods-sdk');
          const swift = execFileSync('cat', ['Package.swift'], { encoding: 'utf8' });
          const podspec = execFileSync('cat', ['WeappContainer.podspec'], { encoding: 'utf8' });
          if (!native || !podArchive || !swift.includes(`checksum: "${native.sha256}"`)
            || !podspec.includes(`:sha256 => '${podArchive.sha256}'`)
            || !podspec.includes(`/releases/download/v${version}/${podArchive.fileName}`)) {
            throw Error('SwiftPM and CocoaPods pins must match the public release assets');
          }
          NODE
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Configure the owner-provided Trunk token
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          test -n "$COCOAPODS_TRUNK_TOKEN"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          writeFileSync(join(process.env.HOME, '.netrc'), `machine trunk.cocoapods.org\n  password ${process.env.COCOAPODS_TRUNK_TOKEN}\n`, { mode: 0o600 });
          NODE
      - name: Submit the exact pinned Podspec
        run: pod trunk push WeappContainer.podspec --allow-warnings
      - name: Verify anonymous Trunk registration
        run: |
          version=$(node -p "require('./package.json').version")
          curl --fail --silent --show-error "https://trunk.cocoapods.org/api/v1/pods/WeappContainer/versions/$version" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const p=JSON.parse(s);if(p.version!=='$version')process.exit(1)})"
