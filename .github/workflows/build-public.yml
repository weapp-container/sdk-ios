name: Build public SDK archives
on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: Successful Public native production run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/source-inventory.mjs
      - name: Download verified current runtime production
        run: node tools/download-production.mjs "${{ inputs.runtime_run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          repository: weapp-container/sdk-contract
          path: .runtime/contract
          persist-credentials: false
      - run: node .runtime/contract/fixtures/make-acceptance-pack.mjs --out .runtime/acceptance-pack
      - run: node tools/build.mjs --native-root .runtime/native --licenses-root .runtime/licenses
      - run: node tools/package-release.mjs --sdk artifacts/ios/WeappContainer --out artifacts/public
      - name: Compile staged SwiftPM consumer
        run: xcodebuild -scheme WeappContainer -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/swift-consumer CODE_SIGNING_ALLOWED=NO
        working-directory: artifacts/ios/WeappContainer
      - name: Validate staged Pod without remote source substitution
        run: pod lib lint artifacts/ios/WeappContainer/WeappContainer.podspec --skip-tests --allow-warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ios
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
