name: SDK source checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify reviewed source and public ABI copy
        run: node tools/check-origin.mjs
      - name: Test standalone wrapper input contracts
        run: npm test
  presentation-input:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test production gesture queue against presentation state changes
        run: node tools/test-presentation-input.mjs
